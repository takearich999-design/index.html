<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLLC Mobile Audit - Production</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style> body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 p-3 shadow-xl">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-600 p-2 rounded-xl text-white shadow-md shadow-emerald-600/30">
                    <i class="fa-solid fa-mobile-screen-button text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xs font-bold text-white leading-tight">KLLC Mobile Audit</h1>
                    <p class="text-[10px] text-slate-400">ระบบตรวจเช็กครุภัณฑ์ตัวจริง</p>
                </div>
            </div>
            <div class="flex items-center gap-2 text-[11px]">
                <span class="bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">ทั้งหมด: <strong id="total-count" class="text-white">0</strong></span>
                <span class="bg-rose-950/80 text-rose-300 px-2 py-1 rounded-lg border border-rose-800">เสีย: <strong id="unusable-count" class="text-rose-400">0</strong></span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-3 space-y-3">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-lg space-y-2.5">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-0.5">ผู้ตรวจ</label>
                    <input type="text" id="inspector-name" placeholder="ชื่อผู้ตรวจ..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-0.5">วันที่</label>
                    <input type="date" id="inspection-date" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 mb-0.5">เลือกห้อง / โซนพื้นที่</label>
                <select id="filter-location" class="w-full bg-slate-950 border border-slate-800 text-white text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-emerald-500">
                    <option value="all">ทุกพื้นที่จัดเก็บ</option>
                </select>
            </div>
        </div>

        <div class="bg-slate-900/90 p-2.5 rounded-2xl border border-slate-800 shadow-md flex items-center gap-2">
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 text-slate-500">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="search-input" placeholder="ค้นหาชื่ออุปกรณ์ หรือรหัส..." 
                    class="w-full pl-8 pr-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-xs focus:outline-none focus:border-emerald-500">
            </div>
            <select id="filter-status" class="bg-slate-950 border border-slate-800 text-white text-xs rounded-xl px-2 py-1.5 focus:outline-none focus:border-emerald-500">
                <option value="all">ทุกสถานะ</option>
                <option value="พร้อมใช้งาน">ปกติ</option>
                <option value="ใช้งานไม่ได้">เสีย</option>
            </select>
        </div>

        <div class="flex justify-end">
            <button onclick="exportChecklistReport()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold shadow-md shadow-emerald-600/30 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-file-contract"></i> ส่งออกรายงานประจำวัน (JSON)
            </button>
        </div>

        <div id="location-sections" class="space-y-4"></div>
    </main>

    <div id="qr-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-4 text-center space-y-3 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-xs font-bold text-emerald-400"><i class="fa-solid fa-qrcode mr-1"></i> QR Code ประจำห้อง</h3>
                <button onclick="closeQrModal()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <h4 id="qr-title" class="text-[11px] font-semibold text-white"></h4>
            <div class="bg-white p-3 rounded-xl inline-block" id="qrcode-container"></div>
            <button onclick="closeQrModal()" class="w-full py-1.5 bg-slate-800 text-white text-xs rounded-xl font-semibold">ปิดหน้าต่าง</button>
        </div>
    </div>

    <div id="issue-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-3">
        <div class="bg-slate-900 border border-rose-900/60 rounded-2xl max-w-sm w-full p-4 space-y-3 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-xs font-bold text-rose-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i> บันทึกอาการเสีย</h3>
                <button onclick="closeIssueModal()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <input type="hidden" id="issue-item-id">

            <div>
                <label class="block text-[10px] font-semibold text-rose-300 mb-1">ระบุอาการชำรุด *</label>
                <textarea id="issue-reason" rows="2" placeholder="ระบุรายละเอียดอาการเสีย..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-xs focus:outline-none focus:border-rose-500"></textarea>
            </div>

            <div>
                <label class="block text-[10px] text-slate-300 mb-1">ตำแหน่งปัจจุบัน (ถ้าถูกย้ายห้อง)</label>
                <input type="text" id="issue-current-loc" placeholder="ห้องปัจจุบัน..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-white text-xs focus:outline-none focus:border-emerald-500">
            </div>

            <div class="space-y-1.5">
                <label class="block text-[10px] text-slate-300">ถ่ายรูปหลักฐาน</label>
                <div class="flex flex-col items-center justify-center border border-dashed border-rose-900/50 bg-slate-950 rounded-xl p-3 text-center">
                    <img id="issue-image-preview" class="w-full h-32 object-cover rounded-lg mb-2 hidden" alt="Evidence">
                    <div id="issue-upload-placeholder" class="space-y-1">
                        <i class="fa-solid fa-camera text-2xl text-rose-400"></i>
                        <p class="text-[10px] text-slate-400">กดถ่ายภาพด้วยกล้องมือถือ</p>
                    </div>
                    <input type="file" id="issue-photo-input" accept="image/*" capture="environment" class="hidden" onchange="handleIssuePhoto(event)">
                    <button type="button" onclick="document.getElementById('issue-photo-input').click()" class="mt-1.5 px-3 py-1.5 bg-rose-950/80 text-rose-200 border border-rose-800 rounded-lg text-[11px] font-semibold flex items-center gap-1.5">
                        <i class="fa-solid fa-camera"></i> เปิดกล้องมือถือ
                    </button>
                </div>
            </div>

            <div class="flex gap-2 pt-2 border-t border-slate-800">
                <button onclick="closeIssueModal()" class="flex-1 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-xs">ยกเลิก</button>
                <button onclick="saveIssueReport()" class="flex-1 py-1.5 bg-rose-600 text-white rounded-xl text-xs font-semibold shadow-md">บันทึกความเสียหาย</button>
            </div>
        </div>
    </div>

    <script>
        let currentIssueBase64 = "";
        
        // Master Dataset Ready for Production Deployment
        const masterDataset = [
            {"id": 1, "sheet": "ห้อง100ที่นั่ง", "code": "57สห990000451116000-05(2)", "name": "เครื่องมิกเซอร์ YAMAHA", "qty": "1", "storage": "ห้อง100ที่นั่ง", "status": "พร้อมใช้งาน", "image": "", "remark": "-", "defect_reason": "", "current_location": "ห้อง100ที่นั่ง"},
            {"id": 2, "sheet": "ห้อง100ที่นั่ง", "code": "57สห990000451116000-06", "name": "ไมโครโฟนไร้สาย SHURE", "qty": "2", "storage": "ห้อง100ที่นั่ง", "status": "พร้อมใช้งาน", "image": "", "remark": "-", "defect_reason": "", "current_location": "ห้อง100ที่นั่ง"},
            {"id": 3, "sheet": "ห้อง100ที่นั่ง", "code": "57สห990000451116000-07", "name": "เครื่องขยายเสียง POWER AMP", "qty": "1", "storage": "ห้อง100ที่นั่ง", "status": "พร้อมใช้งาน", "image": "", "remark": "-", "defect_reason": "", "current_location": "ห้อง100ที่นั่ง"},
            {"id": 4, "sheet": "ห้องประชุมใหญ่", "code": "60สห990000451116001-01", "name": "โปรเจกเตอร์ EPSON 5000 Lumens", "qty": "1", "storage": "ห้องประชุมใหญ่", "status": "พร้อมใช้งาน", "image": "", "remark": "-", "defect_reason": "", "current_location": "ห้องประชุมใหญ่"},
            {"id": 5, "sheet": "ห้องประชุมใหญ่", "code": "60สห990000451116001-02", "name": "จอรับภาพแบบไฟฟ้า 150 นิ้ว", "qty": "1", "storage": "ห้องประชุมใหญ่", "status": "พร้อมใช้งาน", "image": "", "remark": "-", "defect_reason": "", "current_location": "ห้องประชุมใหญ่"},
            {"id": 6, "sheet": "โซน CCTV ชั้น 1", "code": "CTV-L1-01", "name": "กล้อง CCTV Hikvision DOME", "qty": "1", "storage": "โซน CCTV ชั้น 1", "status": "พร้อมใช้งาน", "image": "", "remark": "-", "defect_reason": "", "current_location": "โซน CCTV ชั้น 1"},
            {"id": 7, "sheet": "โซน CCTV ชั้น 1", "code": "CTV-L1-02", "name": "กล้อง CCTV Hikvision BULLET", "qty": "1", "storage": "โซน CCTV ชั้น 1", "status": "พร้อมใช้งาน", "image": "", "remark": "-", "defect_reason": "", "current_location": "โซน CCTV ชั้น 1"}
        ];

        let checklistData = JSON.parse(localStorage.getItem('kllc_checklist_prod_v1')) || masterDataset;

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inspection-date').value = today;

            const savedInspector = localStorage.getItem('kllc_inspector_name') || '';
            document.getElementById('inspector-name').value = savedInspector;

            document.getElementById('inspector-name').addEventListener('input', (e) => {
                localStorage.setItem('kllc_inspector_name', e.target.value);
            });

            const urlParams = new URLSearchParams(window.location.search);
            const targetLoc = urlParams.get('loc');
            
            initLocationFilter();
            if (targetLoc) {
                document.getElementById('filter-location').value = targetLoc;
            }

            filterAndRender();
            updateStats();

            document.getElementById('search-input').addEventListener('input', filterAndRender);
            document.getElementById('filter-location').addEventListener('change', filterAndRender);
            document.getElementById('filter-status').addEventListener('change', filterAndRender);
        });

        function saveStorage() {
            localStorage.setItem('kllc_checklist_prod_v1', JSON.stringify(checklistData));
        }

        function initLocationFilter() {
            const locations = [...new Set(checklistData.map(i => i.storage || i.sheet))];
            const select = document.getElementById('filter-location');
            select.innerHTML = '<option value="all">ทุกพื้นที่จัดเก็บ</option>';
            locations.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc;
                opt.textContent = loc;
                select.appendChild(opt);
            });
        }

        function filterAndRender() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const selectedLoc = document.getElementById('filter-location').value;
            const selectedStatus = document.getElementById('filter-status').value;

            const filtered = checklistData.filter(item => {
                const matchQ = item.name.toLowerCase().includes(query) || item.code.toLowerCase().includes(query) || (item.storage && item.storage.toLowerCase().includes(query));
                const matchL = selectedLoc === 'all' || item.storage === selectedLoc || item.sheet === selectedLoc;
                const matchS = selectedStatus === 'all' || item.status === selectedStatus;
                return matchQ && matchL && matchS;
            });

            renderGroupedByLocation(filtered);
            updateStats();
        }

        function renderGroupedByLocation(items) {
            const container = document.getElementById('location-sections');
            container.innerHTML = '';

            const grouped = {};
            items.forEach(item => {
                const locKey = item.storage || item.sheet || 'พื้นที่ทั่วไป';
                if (!grouped[locKey]) grouped[locKey] = [];
                grouped[locKey].push(item);
            });

            if (Object.keys(grouped).length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-500 text-xs">ไม่พบข้อมูลอุปกรณ์</div>';
                return;
            }

            for (const [locName, locItems] of Object.entries(grouped)) {
                const usableCount = locItems.filter(i => i.status === 'พร้อมใช้งาน').length;
                const totalLoc = locItems.length;

                const section = document.createElement('div');
                section.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2.5 shadow-md';

                section.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <div>
                            <h3 class="text-xs font-bold text-white">${locName}</h3>
                            <p class="text-[10px] text-slate-400">ครบ: <strong class="text-slate-200">${totalLoc}</strong> | ปกติ: <span class="text-emerald-400 font-semibold">${usableCount}</span></p>
                        </div>
                        <button onclick="showLocQr('${locName}')" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-emerald-400 px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1">
                            <i class="fa-solid fa-qrcode"></i> QR ห้อง
                        </button>
                    </div>

                    <div class="space-y-2">
                        ${locItems.map(item => renderItemCard(item)).join('')}
                    </div>
                `;
                container.appendChild(section);
            }
        }

        function renderItemCard(item) {
            const isUsable = item.status === 'พร้อมใช้งาน';
            const defectBlock = item.defect_reason 
                ? `<div class="mt-1.5 p-2 bg-rose-950/60 border border-rose-800/80 rounded-xl text-[11px] text-rose-200">
                    <strong class="text-rose-400">อาการเสีย:</strong> ${item.defect_reason}
                   </div>`
                : '';

            const photoBadge = item.image 
                ? `<div class="mt-1.5 relative rounded-lg overflow-hidden h-24 bg-slate-950 border border-rose-900/50">
                    <img src="${item.image}" class="w-full h-full object-cover">
                   </div>`
                : '';

            const locShiftBadge = (item.current_location && item.current_location !== item.storage)
                ? `<span class="block mt-1 text-[10px] text-amber-400 font-medium"><i class="fa-solid fa-arrow-right-arrow-left mr-1"></i> ย้ายไป: ${item.current_location}</span>`
                : '';

            return `
                <div class="rounded-xl p-3 border transition ${
                    isUsable ? 'bg-slate-950/60 border-slate-800' : 'bg-rose-950/20 border-rose-800/80'
                }">
                    <div class="flex justify-between items-start gap-2">
                        <span class="text-[9px] font-mono text-slate-400 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-800">${item.code}</span>
                        <span class="text-[9px] font-bold px-2 py-0.5 rounded ${
                            isUsable ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'
                        }">${item.status}</span>
                    </div>
                    <h4 class="text-xs font-bold text-white mt-1.5 leading-tight">${item.name}</h4>
                    <p class="text-[10px] text-slate-400 mt-0.5">จำนวน: ${item.qty} ชิ้น</p>
                    ${locShiftBadge}
                    ${defectBlock}
                    ${photoBadge}

                    <div class="pt-2.5 mt-2.5 border-t border-slate-800/80 flex items-center gap-1.5">
                        <button onclick="setUsable(${item.id})" class="flex-1 py-1.5 rounded-lg text-[11px] font-semibold transition ${
                            isUsable ? 'bg-emerald-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-emerald-400'
                        }">
                            <i class="fa-solid fa-check mr-1"></i> ปกติ
                        </button>
                        <button onclick="openIssueModal(${item.id})" class="flex-1 py-1.5 rounded-lg text-[11px] font-semibold transition ${
                            !isUsable ? 'bg-rose-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-rose-400'
                        }">
                            <i class="fa-solid fa-xmark mr-1"></i> แจ้งเสีย
                        </button>
                    </div>
                </div>
            `;
        }

        function setUsable(id) {
            const item = checklistData.find(i => i.id === id);
            if (item) {
                item.status = 'พร้อมใช้งาน';
                item.defect_reason = '';
                item.image = '';
                item.current_location = item.storage;
                saveStorage();
                filterAndRender();
            }
        }

        function openIssueModal(id) {
            const item = checklistData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('issue-item-id').value = item.id;
            document.getElementById('issue-reason').value = item.defect_reason || '';
            document.getElementById('issue-current-loc').value = item.current_location || item.storage || '';
            currentIssueBase64 = item.image || '';

            const preview = document.getElementById('issue-image-preview');
            const placeholder = document.getElementById('issue-upload-placeholder');

            if (currentIssueBase64) {
                preview.src = currentIssueBase64;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                preview.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }

            document.getElementById('issue-modal').classList.remove('hidden');
        }

        function handleIssuePhoto(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    currentIssueBase64 = canvas.toDataURL('image/jpeg', 0.6);

                    const preview = document.getElementById('issue-image-preview');
                    const placeholder = document.getElementById('issue-upload-placeholder');
                    preview.src = currentIssueBase64;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function closeIssueModal() {
            document.getElementById('issue-modal').classList.add('hidden');
        }

        function saveIssueReport() {
            const id = parseInt(document.getElementById('issue-item-id').value);
            const reason = document.getElementById('issue-reason').value.trim();
            const currentLoc = document.getElementById('issue-current-loc').value.trim();

            if (!reason) {
                alert('โปรดระบุอาการชำรุดด้วยค่ะ');
                return;
            }

            const item = checklistData.find(i => i.id === id);
            if (item) {
                item.status = 'ใช้งานไม่ได้';
                item.defect_reason = reason;
                item.current_location = currentLoc || item.storage;
                item.image = currentIssueBase64;

                saveStorage();
                filterAndRender();
                closeIssueModal();
            }
        }

        function showLocQr(locName) {
            document.getElementById('qr-title').textContent = locName;
            const qrContainer = document.getElementById('qrcode-container');
            qrContainer.innerHTML = '';

            const qrUrl = `${window.location.origin}${window.location.pathname}?loc=${encodeURIComponent(locName)}`;

            new QRCode(qrContainer, {
                text: qrUrl,
                width: 150,
                height: 150,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById('qr-modal').classList.remove('hidden');
        }

        function closeQrModal() {
            document.getElementById('qr-modal').classList.add('hidden');
        }

        function updateStats() {
            const total = checklistData.length;
            const usable = checklistData.filter(i => i.status === 'พร้อมใช้งาน').length;
            const unusable = total - usable;

            document.getElementById('total-count').textContent = total;
            document.getElementById('unusable-count').textContent = unusable;
        }

        function exportChecklistReport() {
            const inspector = document.getElementById('inspector-name').value || 'ไม่ระบุ';
            const date = document.getElementById('inspection-date').value || 'ไม่ระบุ';

            const payload = {
                inspection_meta: {
                    inspector_name: inspector,
                    inspection_date: date,
                    timestamp: new Date().toISOString(),
                    total_items: checklistData.length,
                    usable_count: checklistData.filter(i => i.status === 'พร้อมใช้งาน').length,
                    unusable_count: checklistData.filter(i => i.status === 'ใช้งานไม่ได้').length
                },
                checklist_records: checklistData
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `kllc_production_report_${date}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }
    </script>
</body>
</html>
