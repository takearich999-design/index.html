<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLLC AI OS - ระบบ Checklist อุปกรณ์ & CCTV ครบวงจร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 p-4 shadow-2xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-600 p-3 rounded-2xl text-white shadow-lg shadow-emerald-600/30">
                    <i class="fa-solid fa-list-check text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">KLLC AI OS — ระบบ Checklist ครุภัณฑ์ & CCTV</h1>
                    <p class="text-xs text-slate-400">สำนักการเรียนรู้ตลอดชีวิต (KLLC) สจล. | Facility & CCTV Inspection System</p>
                </div>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <div class="bg-slate-800/80 px-3.5 py-2 rounded-xl text-xs border border-slate-700">ทั้งหมด: <strong id="total-count" class="text-white font-bold">405</strong></div>
                <div class="bg-emerald-950/80 border border-emerald-800 px-3.5 py-2 rounded-xl text-xs text-emerald-300"><i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> พร้อมใช้งาน: <strong id="usable-count" class="text-emerald-400 font-bold">405</strong></div>
                <div class="bg-rose-950/80 border border-rose-800 px-3.5 py-2 rounded-xl text-xs text-rose-300"><i class="fa-solid fa-circle-xmark text-rose-400 mr-1"></i> พบปัญหา: <strong id="unusable-count" class="text-rose-400 font-bold">0</strong></div>
            </div>
        </div>
    </header>

    <!-- Inspection Metadata Panel -->
    <main class="max-w-7xl mx-auto p-4 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center gap-2 border-b border-slate-800 pb-3 text-emerald-400 font-semibold text-sm">
                <i class="fa-solid fa-user-check"></i> บันทึกข้อมูลการตรวจประจำวัน (Daily Inspection Logs)
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">ผู้ตรวจ (Inspector Name)</label>
                    <input type="text" id="inspector-name" placeholder="ระบุชื่อผู้ตรวจ..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">วันที่ตรวจ (Inspection Date)</label>
                    <input type="date" id="inspection-date" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">หมวด/โซน (Facility Zone)</label>
                    <select id="filter-sheet" class="w-full bg-slate-950 border border-slate-800 text-white text-sm rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-500">
                        <option value="all">ทุกโซน/รวม CCTV (405 รายการ)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Controls & Filter Bar -->
        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/2 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="ค้นหาชื่ออุปกรณ์, รหัส, CCTV หรือสถานที่..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <div class="w-full md:w-auto flex flex-wrap items-center gap-3">
                <select id="filter-status" class="bg-slate-950 border border-slate-800 text-white text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                    <option value="all">ทุกสถานะ</option>
                    <option value="พร้อมใช้งาน">พร้อมใช้งาน (เขียว)</option>
                    <option value="ใช้งานไม่ได้">พบปัญหา/ใช้งานไม่ได้ (แดง)</option>
                </select>

                <button onclick="exportChecklistReport()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-emerald-600/30 flex items-center gap-2">
                    <i class="fa-solid fa-file-contract"></i> ส่งออกรายงาน Checklist
                </button>
            </div>
        </div>

        <!-- Checklist Grid -->
        <div id="checklist-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Defect & Photo Upload Modal -->
    <div id="issue-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-rose-900/60 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-rose-400 flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i> บันทึกเหตุผลปัญหา & ถ่ายภาพประกอบ
                </h3>
                <button onclick="closeIssueModal()" class="text-slate-500 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <input type="hidden" id="issue-item-id">

            <div>
                <label class="block text-xs font-semibold text-rose-300 mb-1">เหตุผลที่ไม่พร้อมใช้งาน / อาการเสีย *</label>
                <textarea id="issue-reason" rows="3" placeholder="ระบุอาการชำรุด สายหลุด มุมกล้องเพี้ยน ภาพดับ ฯลฯ..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-rose-500"></textarea>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-medium text-slate-300">ถ่ายรูปหลักฐานปัญหา (Camera Photo)</label>
                <div class="flex flex-col items-center justify-center border-2 border-dashed border-rose-900/50 bg-slate-950 rounded-2xl p-4 text-center">
                    <img id="issue-image-preview" class="w-full h-44 object-cover rounded-xl mb-3 hidden" alt="Evidence Photo">
                    <div id="issue-upload-placeholder" class="space-y-2">
                        <i class="fa-solid fa-camera-retro text-3xl text-rose-400"></i>
                        <p class="text-xs text-slate-400">กดปุ่มเพื่อถ่ายภาพด้วยกล้องมือถือ หรือเลือกไฟล์รูป</p>
                    </div>
                    <input type="file" id="issue-photo-input" accept="image/*" capture="environment" class="hidden" onchange="handleIssuePhoto(event)">
                    <button type="button" onclick="document.getElementById('issue-photo-input').click()" class="mt-2 px-4 py-2 bg-rose-950/80 hover:bg-rose-900 text-rose-200 border border-rose-800 rounded-xl text-xs font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-camera"></i> เปิดกล้องมือถือ / เลือกรูป
                    </button>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-3 border-t border-slate-800">
                <button onclick="closeIssueModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs">ยกเลิก</button>
                <button onclick="saveIssueReport()" class="px-5 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-rose-600/30">บันทึกสถานะใช้งานไม่ได้ (สีแดง)</button>
            </div>
        </div>
    </div>

""}, {"id": 406, "sheet": "CCTV KLLC System", "code": "CCTV-MON-01", "name": "จอแสดงผล CCTV Monitor Wall 55 นิ้ว (ห้อง Control)", "qty": "1", "storage": "ห้อง Control CCTV", "status": "พร้อมใช้งาน", "image": "", "remark": "เช็กการแสดงผลภาพสด", "defect_reason": ""}];

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inspection-date').value = today;

            const savedInspector = localStorage.getItem('kllc_inspector_name') || '';
            document.getElementById('inspector-name').value = savedInspector;

            document.getElementById('inspector-name').addEventListener('input', (e) => {
                localStorage.setItem('kllc_inspector_name', e.target.value);
            });

            initFilters();
            filterChecklist();
            updateStats();

            document.getElementById('search-input').addEventListener('input', filterChecklist);
            document.getElementById('filter-sheet').addEventListener('change', filterChecklist);
            document.getElementById('filter-status').addEventListener('change', filterChecklist);
        });

        function saveChecklistStorage() {
            localStorage.setItem('kllc_checklist_full_v3', JSON.stringify(checklistData));
        }

        function initFilters() {
            const sheets = [...new Set(checklistData.map(i => i.sheet))];
            const select = document.getElementById('filter-sheet');
            select.innerHTML = '<option value="all">ทุกโซน/รวม CCTV (405 รายการ)</option>';
            sheets.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                select.appendChild(opt);
            });
        }

        function renderChecklist(data) {
            const grid = document.getElementById('checklist-grid');
            grid.innerHTML = '';

            data.forEach(item => {
                const isUsable = item.status === 'พร้อมใช้งาน';
                const card = document.createElement('div');
                card.className = `rounded-3xl p-5 border transition flex flex-col justify-between shadow-xl ${
                    isUsable 
                    ? 'bg-slate-900/90 border-emerald-900/40 hover:border-emerald-600/60' 
                    : 'bg-rose-950/20 border-rose-800/80 hover:border-rose-500'
                }`;

                const photoBadge = item.image 
                    ? `<div class="mt-3 relative rounded-xl overflow-hidden h-36 bg-slate-950 border border-rose-900/50">
                        <img src="${item.image}" class="w-full h-full object-cover">
                        <span class="absolute bottom-2 left-2 bg-black/80 text-rose-300 text-[10px] px-2 py-0.5 rounded-lg border border-rose-800"><i class="fa-solid fa-camera mr-1"></i> ภาพปัญหา/อาการเสีย</span>
                       </div>`
                    : '';

                const defectBlock = item.defect_reason 
                    ? `<div class="mt-3 p-3 bg-rose-950/60 border border-rose-800/80 rounded-xl text-xs text-rose-200">
                        <strong class="text-rose-400 block mb-0.5"><i class="fa-solid fa-circle-exclamation mr-1"></i> สาเหตุปัญหา:</strong> ${item.defect_reason}
                       </div>`
                    : '';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <span class="text-[10px] font-mono text-slate-400 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800">${item.code}</span>
                            <span class="text-[11px] font-medium px-2.5 py-1 rounded-lg ${
                                isUsable 
                                ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-800/80' 
                                : 'bg-rose-950/80 text-rose-400 border border-rose-800/80 font-bold'
                            }">
                                ${item.sheet}
                            </span>
                        </div>

                        <h4 class="text-sm font-bold text-white mt-3 leading-snug">${item.name}</h4>
                        <div class="text-xs text-slate-400 mt-1 flex gap-3">
                            <span>จำนวน: <strong class="text-slate-200">${item.qty}</strong></span>
                            <span>สถานที่: <strong class="text-slate-200">${item.storage}</strong></span>
                        </div>

                        ${defectBlock}
                        ${photoBadge}
                    </div>

                    <div class="pt-4 mt-4 border-t border-slate-800/80 flex items-center gap-2">
                        <button onclick="setUsable(${item.id})" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                            isUsable 
                            ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30' 
                            : 'bg-slate-800 text-slate-400 hover:bg-emerald-950 hover:text-emerald-400 border border-slate-700'
                        }">
                            <i class="fa-solid fa-circle-check"></i> พร้อมใช้งาน (เขียว)
                        </button>

                        <button onclick="openIssueModal(${item.id})" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                            !isUsable 
                            ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/30' 
                            : 'bg-slate-800 text-slate-400 hover:bg-rose-950 hover:text-rose-400 border border-slate-700'
                        }">
                            <i class="fa-solid fa-circle-xmark"></i> ใช้งานไม่ได้ (แดง)
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setUsable(id) {
            const item = checklistData.find(i => i.id === id);
            if (item) {
                item.status = 'พร้อมใช้งาน';
                item.defect_reason = '';
                item.image = '';
                saveChecklistStorage();
                filterChecklist();
                updateStats();
            }
        }

        function openIssueModal(id) {
            const item = checklistData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('issue-item-id').value = item.id;
            document.getElementById('issue-reason').value = item.defect_reason || '';
            currentIssueBase64 = item.image || '';

            const preview = document.getElementById('issue-image-preview');
            const placeholder = document.getElementById('issue-upload-placeholder');

            if (currentIssueBase64) {
                preview.src = currentIssueBase64;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                preview.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }

            document.getElementById('issue-modal').classList.remove('hidden');
        }

        function handleIssuePhoto(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                currentIssueBase64 = evt.target.result;
                const preview = document.getElementById('issue-image-preview');
                const placeholder = document.getElementById('issue-upload-placeholder');
                preview.src = currentIssueBase64;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function closeIssueModal() {
            document.getElementById('issue-modal').classList.add('hidden');
        }

        function saveIssueReport() {
            const id = parseInt(document.getElementById('issue-item-id').value);
            const reason = document.getElementById('issue-reason').value.trim();

            if (!reason) {
                alert('โปรดระบุสาเหตุหรืออาการชำรุดที่ใช้งานไม่ได้ค่ะ');
                return;
            }

            const item = checklistData.find(i => i.id === id);
            if (item) {
                item.status = 'ใช้งานไม่ได้';
                item.defect_reason = reason;
                item.image = currentIssueBase64;

                saveChecklistStorage();
                filterChecklist();
                updateStats();
                closeIssueModal();
            }
        }

        function filterChecklist() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sheet = document.getElementById('filter-sheet').value;
            const status = document.getElementById('filter-status').value;

            const filtered = checklistData.filter(item => {
                const matchQ = item.name.toLowerCase().includes(query) || item.code.toLowerCase().includes(query) || item.sheet.toLowerCase().includes(query) || item.storage.toLowerCase().includes(query);
                const matchS = sheet === 'all' || item.sheet === sheet;
                const matchSt = status === 'all' || item.status === status;
                return matchQ && matchS && matchSt;
            });

            renderChecklist(filtered);
        }

        function updateStats() {
            const total = checklistData.length;
            const usable = checklistData.filter(i => i.status === 'พร้อมใช้งาน').length;
            const unusable = total - usable;

            document.getElementById('total-count').textContent = total;
            document.getElementById('usable-count').textContent = usable;
            document.getElementById('unusable-count').textContent = unusable;
        }

        function exportChecklistReport() {
            const inspector = document.getElementById('inspector-name').value || 'ไม่ระบุชื่อผู้ตรวจ';
            const date = document.getElementById('inspection-date').value || 'ไม่ระบุวันที่';

            const payload = {
                inspection_meta: {
                    inspector_name: inspector,
                    inspection_date: date,
                    timestamp: new Date().toISOString(),
                    total_items: checklistData.length,
                    usable_count: checklistData.filter(i => i.status === 'พร้อมใช้งาน').length,
                    unusable_count: checklistData.filter(i => i.status === 'ใช้งานไม่ได้').length
                },
                checklist_records: checklistData
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `kllc_inspection_report_${date}_${inspector}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }
    </script>
